
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://two35062-phamthachthao-api-new.onrender.com/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host two35062-phamthachthao-api-new.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass https://two35062-phamthachthao-api-new.onrender.com/health;
        proxy_ssl_server_name on;
        proxy_set_header Host two35062-phamthachthao-api-new.onrender.com;
    }
}
